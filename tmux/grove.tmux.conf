# Grove: sourced from ~/.tmux.conf with
#   source-file ~/.grove/tmux.conf
set -g mouse on
set -g base-index 1
set -g pane-base-index 0
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
# 24-bit colour through to iTerm (the theme uses hex colours)
set -as terminal-features ",xterm*:RGB,iTerm*:RGB"

# ---- header: tmux's status at the top, design A (see the Feature Hub canvas) ----
# Rows: 1 name · ticket · state ··· NEXT   2 recap ··· facts   3 stage track ··· panel buttons
#       4 a thin rule in the state colour.
# The feature-hub mod writes @fh_h1..3 and @fh_fill per window; fh writes @fh_buttons and the
# palette as global options @fh_c_* (fh theme <name>). Other windows show the hub view.
set -g status 4
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default fg=#eeeeee"
set -g status-format[0] "#[fill=#{@fh_c_band} bg=#{@fh_c_band} fg=#eeeeee]#{?@fh_h1,#{@fh_h1},#{?@fh_feature,#[bg=#{@fh_c_name} fg=#000000 bold] #{@fh_feature} #[bg=#{@fh_c_band} nobold fg=#bcbcbc]  starting…,#[bg=#{@fh_c_name} fg=#000000 bold] features #[bg=#{@fh_c_band} nobold fg=#bcbcbc]  #{session_windows} windows}}"
set -g status-format[1] "#[fill=#{@fh_c_band} bg=#{@fh_c_band} fg=#eeeeee]#{?@fh_feature,#{@fh_h2},#[fg=#bcbcbc] ^b N new feature  ·  ^b F pick  ·  ^b n go to window n}"
set -g status-format[2] "#[fill=#{@fh_c_band} bg=#{@fh_c_band} fg=#eeeeee]#{?@fh_feature,#{@fh_h3}#[align=right]#{@fh_buttons},#[fg=#bcbcbc] #{W:#[range=window|#{window_index}]#{?window_active,#[bg=#{@fh_c_name} fg=#000000 bold] ▶ #I #W ,#[bg=#{@fh_c_band} fg=#bcbcbc] #I #W#{?@fh_attn, #{@fh_attn},} }#[norange bg=#{@fh_c_band}]}}"
set -g status-format[3] "#[fill=default bg=default fg=#{?@fh_fill,#{@fh_fill},#{@fh_c_name}}]▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔"

# click a panel button to open / close it; clicks elsewhere act as usual
bind -n MouseDown1Status if -F "#{m:tog:*,#{mouse_status_range}}" { run-shell -b "$HOME/.grove/bin/fh toggle '#{window_name}' '#{s/tog://:mouse_status_range}'" } { select-window -t = }

# ---- panes: panels get a title bar in the band colour; Claude's pane stays bare ----
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-style "fg=#444444"
# fh theme sets the active border to the palette's name colour
set -g pane-active-border-style "fg=#d77757"
set -g pane-border-format "#{?#{==:#{@fh_pane},claude}, ,#[bg=#{@fh_c_band} fg=#{@fh_c_name} bold] ─ #{?@fh_pane,#{@fh_pane},#{pane_current_command}} #[nobold fg=#bcbcbc]#{@fh_hint} #[bg=default]}"

# ---- keys (every click has a key) ----
# prefix + P, then a panel's key (s shell, b be, f fe): open / close that panel
# prefix + F: pick a feature window from a list
bind F choose-tree -Zw -f '#{@fh_feature}'
# prefix + N: start a new feature (name or Linear ticket, optionally followed by -p prompt)
bind N command-prompt -p "new feature (name|TICKET [-p prompt]):" "run-shell -b '$HOME/.grove/bin/fh new %%'"
# prefix + T: a throwaway shell split below, in this feature's worktree
bind T split-window -v -l 30% -c "#{?@fh_path,#{@fh_path},#{pane_current_path}}"
# prefix + | / prefix + - : split side by side / stacked, in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
